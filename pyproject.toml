[project]
name = "immich-folder-organizer"
version = "0.1.0"
description = "Mirror Immich external-library folders into albums"
requires-python = "==3.11.*"
dependencies = [
    "immichpy==9.2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "aiohttp>=3.8.4,<4.0.0",
    "ruff",
    "mypy",
    "types-PyYAML",
    "diff-cover",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["immich_folder_organizer", "tests"]

[tool.coverage.run]
source = ["immich_folder_organizer"]
branch = false
